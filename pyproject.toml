[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "somatic-likelihood-tiering"
version = "2.0.0"
description = "SLT: Interpretable post-calling triage framework for somatic variant classification in tumor-only WES"
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"
authors = [
    {name = "Konrad Stawiski"},
    {name = "Kent Mouw"},
]
keywords = [
    "somatic variant triage",
    "tumor-only sequencing",
    "whole-exome sequencing",
    "clonal hematopoiesis",
    "CHIP",
    "PureCN",
    "bioinformatics",
    "post-calling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
slt-classify = "slt_classify:main"

[project.urls]
Repository = "https://github.com/kstawiski/somatic-likelihood-tiering"

[project.optional-dependencies]
test = ["pytest>=7.0"]
benchmark = ["numpy", "scikit-learn", "matplotlib"]

[tool.setuptools]
py-modules = ["slt_classify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
